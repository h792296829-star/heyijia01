from fastapi import FastAPI, Depends, HTTPException
from fastapi.middleware.cors import CORSMiddleware
from sqlalchemy.orm import Session

from db import Base, engine, get_db
from models import Scene, Node, Run
from schemas import SceneCreate, SceneOut, SceneDetail, NodeIn, RunCreate, RunOut
from seed import seed_if_empty
from service import run_audit

Base.metadata.create_all(bind=engine)

app = FastAPI(title="智能审核SaaS后端（示例）", version="0.1.0")

# allow your local html to call backend
app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

@app.on_event("startup")
def _startup():
    # seed demo data once
    from db import SessionLocal
    db = SessionLocal()
    try:
        seed_if_empty(db)
    finally:
        db.close()

@app.get("/health")
def health():
    return {"ok": True}

# ---------- Scenes ----------
@app.get("/api/scenes", response_model=list[SceneOut])
def list_scenes(db: Session = Depends(get_db)):
    scenes = db.query(Scene).order_by(Scene.id.asc()).all()
    return [{"id":s.id, "name":s.name, "description":s.description} for s in scenes]

@app.post("/api/scenes", response_model=SceneDetail)
def create_scene(body: SceneCreate, db: Session = Depends(get_db)):
    if db.query(Scene).filter(Scene.name == body.name).first():
        raise HTTPException(400, "scene name already exists")
    scene = Scene(name=body.name, description=body.description)
    db.add(scene)
    db.commit()
    db.refresh(scene)

    for n in body.nodes:
        node = Node(scene_id=scene.id, **n.model_dump())
        db.add(node)
    db.commit()
    db.refresh(scene)
    return get_scene(scene.id, db)

@app.get("/api/scenes/{scene_id}", response_model=SceneDetail)
def get_scene(scene_id: int, db: Session = Depends(get_db)):
    scene = db.query(Scene).filter(Scene.id == scene_id).first()
    if not scene:
        raise HTTPException(404, "scene not found")
    nodes = db.query(Node).filter(Node.scene_id == scene_id).order_by(Node.order.asc()).all()
    return {
        "id": scene.id,
        "name": scene.name,
        "description": scene.description,
        "nodes": [
            {"key":n.key, "title":n.title, "order":n.order, "x":n.x, "y":n.y, "prompt_template":n.prompt_template}
            for n in nodes
        ]
    }

@app.put("/api/scenes/{scene_id}", response_model=SceneOut)
def update_scene(scene_id: int, body: SceneCreate, db: Session = Depends(get_db)):
    scene = db.query(Scene).filter(Scene.id == scene_id).first()
    if not scene:
        raise HTTPException(404, "scene not found")
    scene.name = body.name
    scene.description = body.description
    db.commit()
    return {"id": scene.id, "name": scene.name, "description": scene.description}

@app.get("/api/scenes/{scene_id}/nodes", response_model=list[NodeIn])
def list_nodes(scene_id: int, db: Session = Depends(get_db)):
    nodes = db.query(Node).filter(Node.scene_id == scene_id).order_by(Node.order.asc()).all()
    return [{"key":n.key,"title":n.title,"order":n.order,"x":n.x,"y":n.y,"prompt_template":n.prompt_template} for n in nodes]

@app.put("/api/scenes/{scene_id}/nodes", response_model=list[NodeIn])
def replace_nodes(scene_id: int, nodes: list[NodeIn], db: Session = Depends(get_db)):
    scene = db.query(Scene).filter(Scene.id == scene_id).first()
    if not scene:
        raise HTTPException(404, "scene not found")
    # delete old
    db.query(Node).filter(Node.scene_id == scene_id).delete()
    db.commit()
    # add new
    for n in nodes:
        db.add(Node(scene_id=scene_id, **n.model_dump()))
    db.commit()
    return list_nodes(scene_id, db)

# ---------- Runs ----------
@app.get("/api/runs", response_model=list[RunOut])
def list_runs(db: Session = Depends(get_db)):
    runs = db.query(Run).order_by(Run.id.desc()).limit(100).all()
    return [
        {
            "id": r.id,
            "scene_id": r.scene_id,
            "status": r.status,
            "conclusion": r.conclusion,
            "risk": r.risk,
            "input_text": r.input_text,
            "results": r.results or {},
            "merged": r.merged or {},
        } for r in runs
    ]

@app.get("/api/runs/{run_id}", response_model=RunOut)
def get_run(run_id: int, db: Session = Depends(get_db)):
    r = db.query(Run).filter(Run.id == run_id).first()
    if not r:
        raise HTTPException(404, "run not found")
    return {
        "id": r.id,
        "scene_id": r.scene_id,
        "status": r.status,
        "conclusion": r.conclusion,
        "risk": r.risk,
        "input_text": r.input_text,
        "results": r.results or {},
        "merged": r.merged or {},
    }

@app.post("/api/runs", response_model=RunOut)
def create_run(body: RunCreate, db: Session = Depends(get_db)):
    try:
        run = run_audit(db, scene_id=body.scene_id, text=body.text, meta=body.meta, model=body.model)
    except ValueError as e:
        raise HTTPException(404, str(e))
    except RuntimeError as e:
        # e.g. missing api key
        raise HTTPException(500, str(e))
    return get_run(run.id, db)
